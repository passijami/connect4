[tool.poetry]
name = "connect4"
version = "0.1.0"
description = "Connect4-tekoäly minimaxilla ja alfa-beta-karsinnalla"
authors = ["Jami Passi <jamipassi.jp@gmail.com>"]
readme = "README.md"
packages = [{include = "connect4", from = "src"}]
 
[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.scripts]
connect4 = "connect4.cli:main"
 
[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
coverage = "^7.0"
pylint = "^3.0"
invoke = "^2.0"
 
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
 
